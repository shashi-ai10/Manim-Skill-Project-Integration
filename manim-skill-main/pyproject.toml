[project]
name = "manim-skill"
version = "2.0.0"
description = "Autonomous educational video production agent combining Manim, Kokoro TTS, procedural sound design, and Nexus Vision QA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18.0,<=0.22.1",
    "kokoro>=0.9.4",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "srt>=3.5.3",
    "openai>=1.12.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "mcp>=1.0.0",
]
